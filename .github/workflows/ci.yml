name: CI

on:
  workflow_dispatch:
  pull_request:
  push:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore template.slnx
      - name: Build
        run: dotnet build template.slnx -c Release --no-restore
      - name: Test
        run: dotnet test app-service/Tests/AppService.IntegrationTests.csproj -c Release --no-build

  frontend:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: web-frontend/package-lock.json
      - run: npm ci
      - run: npm run lint:ci
      - run: npm run type-check
      - run: npm run build

  docker:
    name: Docker Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api-proxy
            dockerfile: api-proxy/Dockerfile
          - image: app-service
            dockerfile: app-service/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --file ${{ matrix.dockerfile }} --tag service-template/${{ matrix.image }}:ci-${{ github.sha }} .

